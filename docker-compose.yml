services:
  db:
    image: postgres:16-alpine
    container_name: posfnb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: posfnb
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - posfnb-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  posfnb-db:
