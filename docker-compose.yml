services:
  db:
    image: postgres:16-alpine
    container_name: posfnb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Di server, isi POSTGRES_PASSWORD di file .env (dan samakan dengan DATABASE_URL).
      # Catatan: password hanya dipakai saat volume database pertama kali dibuat.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: posfnb
      TZ: Asia/Jakarta
    ports:
      # Hanya bisa diakses dari komputer/server ini sendiri, tidak terbuka ke internet
      - "127.0.0.1:5432:5432"
    volumes:
      - posfnb-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  posfnb-db:
